[project]
name = "cn0566-single-carrier-qpsk-audio"
version = "1.3.0"
description = "Real-time single-carrier QPSK audio link for CN0566, PlutoSDR and Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bowen Yu" }]
dependencies = [
  "numpy>=1.22,<2.0",
  "scipy>=1.8,<1.14",
  "matplotlib>=3.3,<3.9",
  "pyadi-iio>=0.0.21",
  "pylibiio>=0.25",
]

[project.urls]
Documentation = "https://github.com/YOUR_ACCOUNT/cn0566-single-carrier-qpsk-audio"
Source = "https://github.com/YOUR_ACCOUNT/cn0566-single-carrier-qpsk-audio"
Issues = "https://github.com/YOUR_ACCOUNT/cn0566-single-carrier-qpsk-audio/issues"
